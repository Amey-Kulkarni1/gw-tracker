<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8" />
  <title>GW Tracker - Options</title>
  <link rel="stylesheet" href="options.css" />
</head>

<body>
  <div class="container">
    <div class="header-row">
      <h1>GW Tracker</h1>
      <button id="openSettingsBtn" class="icon-btn" title="Settings">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
      </button>
    </div>
    <div id="message"></div>

    <!-- Settings Modal -->
    <div id="settingsModal" class="modal-overlay" style="display: none;">
      <div class="modal-content">
        <div class="modal-header">
          <h2>Settings</h2>
          <button id="closeSettingsBtn" class="close-btn">&times;</button>
        </div>

        <div class="settings-section">
          <h3>URL Redirections</h3>
          <p class="settings-desc">Enable or disable automatic link redirections:</p>
          <div class="toggle-list">
            <label class="toggle-item">
              <input type="checkbox" id="toggleInstagram" checked />
              <div class="toggle-info">
                <span class="toggle-title">Instagram Reels &rarr; Post</span>
                <span class="toggle-sub">Redirects <code>/reel/</code> to <code>/p/</code></span>
              </div>
            </label>
            <label class="toggle-item">
              <input type="checkbox" id="toggleTelegram" checked />
              <div class="toggle-info">
                <span class="toggle-title">Telegram Shortlinks</span>
                <span class="toggle-sub">Redirects <code>t.me</code> to <code>telegram.me</code></span>
              </div>
            </label>
            <label class="toggle-item">
              <input type="checkbox" id="toggleStake" checked />
              <div class="toggle-info">
                <span class="toggle-title">Stake Mirror</span>
                <span class="toggle-sub">Redirects <code>stake.com</code> to <code>stake.ac</code></span>
              </div>
            </label>
          </div>
        </div>

        <div class="settings-section">
          <h3>Data Management</h3>
          <p class="settings-desc">Import backup files or export your saved items.</p>
          <div class="button-group">
            <button id="importData" class="btn-secondary">Import Data</button>
            <button id="exportData" class="btn-primary">Export All Data</button>
            <input type="file" id="importFile" accept="application/json" style="display: none" />
          </div>
        </div>
      </div>
    </div>

    <div class="features-grid">
      <div class="feature-column" id="saveForLaterContainer">
        <div id="sflAddForm" class="form-section" style="display: none">
          <h2>Add/Edit Saved Item</h2>
          <form id="sflSaveForm">
            <div class="form-row">
              <label for="sflUrl">URL:</label><input type="url" id="sflUrl" required />
            </div>
            <div class="form-row">
              <label for="sflDate">Date:</label><input type="date" id="sflDate" required />
            </div>
            <div class="button-group">
              <button type="submit" class="btn-primary">Save Item</button>
              <button type="button" id="sflCancelAdd" class="btn-secondary">
                Cancel
              </button>
            </div>
          </form>
        </div>

        <div class="saved-tabs-section">
          <div class="controls">
            <div class="controls-header">
              <h2>Saved Items</h2>
            </div>
            <div class="action-buttons">
              <button id="sflDeleteSelected" class="btn-danger">
                Delete Selected
              </button>
              <button id="sflOpenTodays" class="btn-secondary">
                Open Today's
              </button>
              <button id="sflOpenTomorrows" class="btn-secondary">
                Open Tomorrow's
              </button>
              <button id="sflAddNew" class="btn-primary">Add New</button>
            </div>
            <div class="sort-controls">
              <label>Sort by:</label>
              <select id="sflSortBy">
                <option value="date">Date</option>
                <option value="title">URL</option>
                <option value="dateAdded">Date Added</option>
              </select>
              <select id="sflSortOrder">
                <option value="asc">Ascending</option>
                <option value="desc">Descending</option>
              </select>
            </div>
          </div>

          <div class="list-header-row">
            <div class="item-selection" style="visibility: hidden;"></div> <!-- Spacer -->
            <div class="select-all-container">
              <input type="checkbox" id="sflSelectAllCheckbox" /><label for="sflSelectAllCheckbox">Select All</label>
            </div>
          </div>

          <div id="sflTabsList"></div>
          <div id="sflNoTabs" class="no-tabs" style="display: none">
            No saved items yet.
          </div>
        </div>
      </div>

    </div>
  </div>
  <script src="options.js"></script>
</body>

</html>
